# MacBookPro14,2 s2idle power saving.
ENABLED=1
ALLOW_REGULAR_BOOT=1
MODE=wifi
WIFI_KEEP_BOUND=1
THUNDERBOLT_L1=1
REQUIRE_EXTERNAL_USB_EMPTY=1
# Power both idle Alpine Ridge controllers off during s2idle
# (requires the mbp142_tb_poweroff module and macbook-tb-poweroff.service).
THUNDERBOLT_POWEROFF=1
# Also power an idle side off while awake (macbook-tb-awake.service).
THUNDERBOLT_AWAKE_POWEROFF=1
# Enable ASPM L1 on powered Alpine Ridge links while awake (macbook-tb-awake).
THUNDERBOLT_AWAKE_L1=1
# Send the T1 Apple's host sleep/wake notification (requires mbp142_t1_socw).
T1_SOCW=1
# Resume from s2idle when the lid opens (requires mbp142_lid_wake).
LID_WAKE=1

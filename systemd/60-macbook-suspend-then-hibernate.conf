# MacBookPro14,2: hibernate after 60 min of s2idle on battery; stay in s2idle
# on AC power. After saving the image, power off (S5) instead of ACPI S4.
# Requires a swap file and resume=/resume_offset= on the kernel command line.
[Sleep]
AllowSuspend=yes
AllowHibernation=yes
AllowSuspendThenHibernate=yes
HibernateDelaySec=60min
HibernateOnACPower=no
HibernateMode=shutdown

# Drop-in for t1bridge-keybag.service (install as
# /etc/systemd/system/t1bridge-keybag.service.d/10-after-import.conf).
# t1bridge-import and the keybag relay both talk to the T1 SEP over USB. Without
# ordering, the relay starts during the import and fails its first attempt
# ("prepare shared keybags failed").
[Unit]
After=t1bridge-import.service

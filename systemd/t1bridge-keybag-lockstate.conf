# Drop-in for t1bridge-keybag.service (install as
# /etc/systemd/system/t1bridge-keybag.service.d/20-lockstate-fix.conf).
# Runs the keybag relay built from T1Bridge v0.1.12 with keybag-lockstate.patch,
# which lets the freshly promoted device keybag settle instead of failing the
# first start after every boot. Remove this file and run
# "systemctl daemon-reload" to return to the packaged relay.
[Service]
ExecStart=
ExecStart=/usr/local/lib/macbook/t1-keybag-relay
